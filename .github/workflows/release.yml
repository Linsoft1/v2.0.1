name: Build and publish Linsoft Browser

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run build:installer -- --publish never 2>&1 | Tee-Object -FilePath build-windows.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $details = Select-String -Path build-windows.log -Pattern '(?i)(error|failed|exception|ENOENT|EPERM|signtool)' | Select-Object -Last 12
            if ($details) {
              $summary = ($details | ForEach-Object { $_.Line }) -join ' | '
              Write-Output "::error title=Windows installer build::$summary"
            }
            exit $buildExitCode
          }
        env:
          DEBUG: electron-builder
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-files
          path: |
            dist/Linsoft-Browser-Setup-*.exe
            dist/latest.yml
            dist/*.blockmap

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux app bundle
        run: npx electron-builder --linux dir --publish never

      - name: Build and verify Linsoft Debian package
        run: |
          rm -rf dist-debian-final
          mkdir -p dist-debian-final
          cp -R dist/linux-unpacked dist-debian-final/linux-unpacked
          node tools/build-deb.cjs
          node tools/verify-deb.cjs
          mkdir -p release-staging
          cp dist-debian-final/*.deb release-staging/

      - name: Upload Debian release files
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-files
          path: release-staging/*.deb

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
