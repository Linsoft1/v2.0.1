<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#153b55"/><stop offset="1" stop-color="#0b2335"/></linearGradient>
    <linearGradient id="sun" x2="1" y2="1"><stop stop-color="#ffe2a0"/><stop offset="1" stop-color="#ff9f63"/></linearGradient>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#eaf5fb}.muted{fill:#95b0c2}.link{fill:#77d6f7;font-weight:700}.small{font-size:13px}.body{font-size:14px}.title{font-size:20px;font-weight:700}.brand{font-size:23px;font-weight:800}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#091b29"/>
  <rect width="1200" height="43" fill="#102d42"/>
  <circle cx="20" cy="21" r="6" fill="#ff746d"/><circle cx="40" cy="21" r="6" fill="#ffd36a"/><circle cx="60" cy="21" r="6" fill="#54d6aa"/>
  <rect x="88" y="9" width="600" height="25" rx="8" fill="#0b2030" stroke="#29465a"/>
  <text x="106" y="26" class="small muted">Linsoft Browser — ilustračný náhľad</text>
  <text x="35" y="91" class="brand"><tspan fill="#ffc46d">Lin</tspan><tspan fill="#89d7fa">soft</tspan></text>
  <rect x="202" y="59" width="950" height="43" rx="13" fill="#0d2537" stroke="#35536a"/>
  <circle cx="225" cy="80" r="7" fill="none" stroke="#9bc3d7" stroke-width="2"/>
  <path d="m230 85 6 6" stroke="#9bc3d7" stroke-width="2"/>
  <text x="249" y="85" class="body">planéty slnečnej sústavy</text>
  <rect x="35" y="122" width="1130" height="30" rx="9" fill="#e7a94e"/>
  <text x="53" y="142" font-size="13" font-weight="800" fill="#142535">ILUSTRAČNÝ NÁHĽAD • VYMYSLENÉ UKÁŽKOVÉ VÝSLEDKY</text>
  <text x="35" y="188" class="small muted">Všetko　　Web　　Obrázky　　Videá　　Správy</text>
  <path d="M35 202h1130" stroke="#294355"/>
  <text x="45" y="236" class="small muted">Príklady výsledkov pre „planéty slnečnej sústavy“</text>
  <text x="48" y="278" class="small muted">ukážkové výsledky · vzdelávanie</text>
  <text x="48" y="308" class="title link">Ako funguje slnečná sústava?</text>
  <text x="48" y="337" class="body muted">Planéty obiehajú okolo hviezdy po dráhach. Vzdialenosť, zloženie</text>
  <text x="48" y="359" class="body muted">a veľkosť ovplyvňujú podmienky na každej planéte.</text>
  <text x="48" y="399" class="small muted">ukážkový článok · veda</text>
  <text x="48" y="429" class="title link">Osem planét a ich obežné dráhy</text>
  <text x="48" y="458" class="body muted">Prehľad slnečnej sústavy s jednoduchou schémou jednotlivých dráh.</text>
  <text x="48" y="499" class="small muted">ukážkový sprievodca · astronómia</text>
  <text x="48" y="529" class="title link">Čo vieme o vzdialených svetoch?</text>
  <text x="48" y="558" class="body muted">Základné fakty a pojmy pre každého, kto začína objavovať vesmír.</text>
  <rect x="790" y="231" width="355" height="348" rx="18" fill="#102d42" stroke="#28475c"/>
  <rect x="808" y="249" width="319" height="150" rx="13" fill="url(#sky)"/>
  <circle cx="1056" cy="295" r="32" fill="url(#sun)"/>
  <ellipse cx="967" cy="323" rx="105" ry="29" fill="none" stroke="#8fc8e0" stroke-opacity=".7"/>
  <ellipse cx="967" cy="323" rx="68" ry="20" fill="none" stroke="#8fc8e0" stroke-opacity=".55"/>
  <ellipse cx="967" cy="323" rx="34" ry="10" fill="none" stroke="#8fc8e0" stroke-opacity=".42"/>
  <circle cx="896" cy="323" r="8" fill="#69c8eb"/><circle cx="948" cy="303" r="6" fill="#d2a7f7"/><circle cx="1001" cy="341" r="10" fill="#ffab73"/>
  <text x="811" y="435" class="title">Slnečná sústava</text>
  <text x="811" y="462" class="body muted">Vzdelávacia ukážka — ilustračné</text>
  <text x="811" y="484" class="body muted">údaje, nie živé výsledky vyhľadávania.</text>
  <path d="M811 506h285" stroke="#29485c"/>
  <text x="811" y="536" class="small muted">Zobrazenie: Web · Poskytovateľ: podľa nastavenia</text>
